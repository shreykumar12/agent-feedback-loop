[project]
name = "agent-eval"
version = "0.1.0"
description = "Self-correcting coding agent with deterministic evaluation, a bounded retry loop, and regression detection"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"agent_eval/_harness.py" = ["B", "UP"]
